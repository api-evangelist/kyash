summary: >-
  Kyash operates no public developer platform, so there is no published API
  versioning or deprecation policy. Operational transparency is delivered through
  dated service notices on the corporate site: a scheduled/emergency maintenance
  feed, a service information feed, and press releases. These are the closest
  equivalent to a status page and are actively updated (multiple entries in July
  2026). Any API lifecycle terms for the B2B Payout service are set contractually
  during sales onboarding and are not published.
