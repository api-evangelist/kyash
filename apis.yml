aid: kyash
name: Kyash
description: >-
  Kyash Inc. (株式会社Kyash) is a Tokyo-based fintech founded in 2015 that operates a
  consumer mobile wallet and Visa prepaid card in Japan, covering charging, peer-to-peer
  transfers, shared accounts, buy-now-pay-later, personal finance management, and
  contactless payment through Apple Pay, Google Pay, and Samsung Pay. Kyash is a
  registered Funds Transfer Service Provider (Kanto Local Finance Bureau No. 00082) and
  a third-party Prepaid Payment Instrument Issuer (No. 00698), and is ISO/IEC 27001:2022,
  PCI DSS, and TRUSTe certified. Its business-facing product is Kyash Payout, a mass
  payout service that sends funds to Japanese domestic bank accounts or Kyash wallets at
  a flat 50 yen per transfer, integrated either by Zengin/CSV file upload or by direct
  API integration including a balance API. Kyash previously sold Kyash Direct, an
  API-based Visa card issuer processing platform launched in 2019. All API access is
  sales-gated: Kyash publishes no developer portal, API reference, specification, SDK,
  or sandbox.
